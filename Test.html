<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Me? E-Postcard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 55%, #fbc2eb 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      padding: 20px;
    }

    .postcard {
      position: relative;
      width: 100%;
      max-width: 460px;
      background: #fff9fb;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(214, 51, 108, 0.22);
      border: 3px dashed #ff8fab;
      z-index: 2;
    }

    .heart-badge {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 14px;
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }

    .tag {
      display: inline-block;
      background: #ffe5ec;
      color: #c9184a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 36px;
      color: #590d22;
      margin-bottom: 10px;
    }

    .message {
      font-size: 15px;
      color: #6c4a52;
      margin-bottom: 28px;
      min-height: 24px;
      transition: all 0.25s ease;
    }

    .btn-area {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 120px;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    #yesBtn {
      background: #ff4d6d;
      color: #ffffff;
      padding: 14px 32px;
      box-shadow: 0 10px 24px rgba(255, 77, 109, 0.35);
      z-index: 3;
    }

    #yesBtn:hover {
      background: #e01e37;
      transform: scale(1.05);
    }

    #noBtn {
      background: #e9ecef;
      color: #495057;
      padding: 14px 28px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      z-index: 2;
    }

    #noBtn:hover {
      background: #dee2e6;
    }

    .accepted-box {
      display: none;
      animation: popIn 0.45s ease forwards;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .accepted-box h2 {
      font-size: 30px;
      color: #c9184a;
      margin-bottom: 12px;
    }

    .accepted-box p {
      font-size: 16px;
      color: #590d22;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .reset-btn {
      background: #ffb3c1;
      color: #590d22;
      padding: 10px 22px;
      font-size: 14px;
    }

    .reset-btn:hover {
      background: #ff8fab;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="postcard" id="postcard">
    <div id="questionView">
      <div class="tag">Special E-Postcard</div>
      <div class="heart-badge">💌</div>
      <h1>Love Me?</h1>
      <p class="message" id="statusText">ဒီ postcard လေးကို ဖွင့်ကြည့်ပြီး အဖြေလေး ပေးပါဦး 🥺</p>

      <div class="btn-area" id="btnArea">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 🙈</button>
      </div>
    </div>

    <div class="accepted-box" id="acceptedView">
      <div class="heart-badge">🥰💘</div>
      <h2>Yay!! I knew it!</h2>
      <p>
        နောက်ဆုံးတော့ <strong>Yes</strong> နှိပ်လိုက်ပြီနော်! <br />
        ဒီနေ့လေး ပျော်ရွှင်ပြီး ချစ်ခြင်းမေတ္တာတွေနဲ့ ပြည့်စုံပါစေ 💕
      </p>
      <button class="reset-btn" id="resetBtn">ပြန်စမယ် ↺</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const btnArea = document.getElementById("btnArea.innerHTML")
    const statusText = document.getElementById("statusText");
    const questionView = document.getElementById("questionView");
    const acceptedView = document.getElementById("acceptedView");
    const resetBtn = document.getElementById("resetBtn");

    const noMessages = [
      "သေချာလို့လား? တစ်ခါလောက် ပြန်စဉ်းစားကြည့်ပါဦး 🥺",
      "No ခလုတ်လေးက ရှက်နေလို့ ထွက်ပြေးနေပြီ 😆",
      "Yes ကို နှိပ်လိုက်ပါတော့နော်... please? 🌷",
      "မရဘူးနော် Yes နှိပ်မှ ရမှာ 😜",
      "Yes ခလုတ်ကြီးလည်း ကြီးလာပြီလေ ကြည့်ပါဦး 💖"
    ];

    let noCount = 0;
    let yesScale = 1;

    function moveAndTeaseNoButton() {
      noCount++;

      // Update teasing message
      const msgIndex = Math.min(noCount - 1, noMessages.length - 1);
      statusText.textContent = noMessages[msgIndex];

      // Make Yes button grow gradually
      yesScale = Math.min(yesScale + 0.16, 2.2);
      yesBtn.style.transform = `scale(${yesScale})`;

      // Move No button inside viewport safely
      noBtn.style.position = "fixed";
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const padding = 20;

      const maxX = Math.max(padding, window.innerWidth - btnWidth - padding);
      const maxY = Math.max(padding, window.innerHeight - btnHeight - padding);

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Trigger on hover (desktop) and touch/click (mobile/mouse)
    noBtn.addEventListener("mouseenter", moveAndTeaseNoButton);
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      moveAndTeaseNoButton();
    });
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveAndTeaseNoButton();
    }, { passive: false });

    // Accept when Yes is clicked
    yesBtn.addEventListener("click", () => {
      questionView.style.display = "none";
      noBtn.style.display = "none";
      acceptedView.style.display = "block";
      launchHearts(28);
    });

    // Reset card
    resetBtn.addEventListener("click", () => {
      noCount = 0;
      yesScale = 1;
      yesBtn.style.transform = "scale(1)";
      noBtn.style.display = "inline-block";
      noBtn.style.position = "static";
      noBtn.style.left = "";
      noBtn.style.top = "";
      statusText.textContent = "ဒီ postcard လေးကို ဖွင့်ကြည့်ပြီး အဖြေလေး ပေးပါဦး 🥺";
      acceptedView.style.display = "none";
      questionView.style.display = "block";
    });

    function launchHearts(count) {
      const icons = ["💖", "💕", "💗", "🌸", "✨"];
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.textContent = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = `${Math.random() * 100}vw`;
        heart.style.fontSize = `${18 + Math.random() * 20}px`;
        heart.style.animationDuration = `${2.5 + Math.random() * 2.5}s`;
        heart.style.animationDelay = `${Math.random() * 0.6}s`;
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5500);
      }
    }
  </script>
</body>
</html>
